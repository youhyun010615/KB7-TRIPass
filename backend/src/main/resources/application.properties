# =====================================================
# TRIPass 백엔드 공통 환경변수 설정
# 실제 민감값은 OS 환경변수 또는 application-local.properties에 설정
# ${환경변수:기본값} 형식으로 값을 주입
# =====================================================

# --- Database (log4jdbc 드라이버 스파이로 SQL 로그 활성화) ---
#db.url=jdbc:log4jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tripass}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
db.url=jdbc:log4jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tripass}?useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}

# --- JWT ---
jwt.secret=${JWT_SECRET:tripass-dev-secret-key-change-before-production}
jwt.access.expiration.ms=${JWT_ACCESS_EXPIRATION:86400000}
jwt.refresh.expiration.ms=${JWT_REFRESH_EXPIRATION:604800000}

# --- 외부 API ---
codef.client-id=${CODEF_CLIENT_ID:}
codef.client-secret=${CODEF_CLIENT_SECRET:}
exchange.api-key=${EXCHANGE_API_KEY:}

# --- AI 여행 예산 추천 (OpenAI) ---
# API 키는 반드시 OS 환경변수 또는 application-local.properties로 주입합니다.
# --- Google Cloud OCR 및 번역 ---
google.cloud.project-id=${GOOGLE_CLOUD_PROJECT:}

# --- 파일 업로드 (영수증 이미지 등) ---
upload.path=${UPLOAD_PATH:/tmp/tripass/uploads}

# --- SolAPI ---
solapi.api-key=${SOLAPI_API_KEY:}
solapi.api-secret=${SOLAPI_API_SECRET:}
solapi.from=${SOLAPI_FROM:}
# Refresh Token 쿠키 설정
# 로컬 HTTP 환경은 false, 운영 HTTPS 환경은 true
auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}

# --- Kakao OAuth ---
kakao.oauth.client-id=${KAKAO_OAUTH_CLIENT_ID:}
kakao.oauth.client-secret=${KAKAO_OAUTH_CLIENT_SECRET:}
kakao.oauth.redirect-uri=${KAKAO_OAUTH_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}
kakao.oauth.token-uri=https://kauth.kakao.com/oauth/token
kakao.oauth.user-info-uri=https://kapi.kakao.com/v2/user/me
