plugins {
    id 'java'
    id 'war'
}

group = 'com.tripass'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    springVersion         = '5.3.37'   // KB 명세 기준
    lombokVersion         = '1.18.30'
    junitVersion          = '5.10.0'
    jacksonVersion        = '2.13.5'
}

dependencies {
    // Spring Web / Core
    implementation("org.springframework:spring-context:${springVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation 'javax.inject:javax.inject:1'


    // 2. MyBatis & Database
    implementation 'com.mysql:mysql-connector-j:9.3.0'
    implementation 'com.zaxxer:HikariCP:2.7.4'            // KB 명세: 2.7.4
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation 'org.mybatis:mybatis:3.4.6'             // KB 명세: 3.4.6
    implementation 'org.mybatis:mybatis-spring:1.3.2'      // KB 명세: 1.3.2

    // Logging & SQL 로그
    implementation 'org.apache.logging.log4j:log4j-api:2.18.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.18.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.18.0'
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'
    implementation 'xerces:xercesImpl:2.12.2'

    // Utilities & JSON (LocalDate/LocalDateTime 파싱 필수 모듈 추가)
    compileOnly         "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}" // Java 8 Date/Time 지원

    // Java EE annotations (Java 17 대응)
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // 4. Java 17 Servlet Container (Provided)
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'

    // Test
    testImplementation          "org.springframework:spring-test:${springVersion}"
    testImplementation          "org.mockito:mockito-core:4.11.0"
    testImplementation          'org.mockito:mockito-junit-jupiter:4.11.0'
    testImplementation          'org.hamcrest:hamcrest:2.2'
    testImplementation          'com.jayway.jsonpath:json-path:2.8.0'
    testCompileOnly             "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor     "org.projectlombok:lombok:${lombokVersion}"
    testImplementation          "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly             "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

}

// Windows 환경에서도 Java 소스를 UTF-8로 컴파일
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
test {
    useJUnitPlatform()
}