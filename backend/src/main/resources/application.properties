# =====================================================
# TRIPass 애플리케이션 설정
# 로컬 DB 비밀번호 등 민감 정보는 application-local.properties 에 작성
# (application-local.properties 는 .gitignore 처리되어 있음)
# =====================================================

# --- Database (log4jdbc 드라이버 스파이로 SQL 로그 활성화) ---
db.url=jdbc:log4jdbc:mysql://localhost:3306/tripass?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
db.username=root
db.password=

# --- JWT ---
# 반드시 실제 운영 환경에서는 충분한 길이의 랜덤 문자열로 교체
jwt.secret=tripass-dev-secret-key-change-before-production
jwt.expiration.ms=86400000

# --- 파일 업로드 (영수증 이미지 등) ---
upload.path=/tmp/tripass/uploads
