language: "ko-KR"

reviews:
  profile: "chill"
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!**/.gitkeep"
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.idea/**"
    - "!**/.gradle/**"
  path_instructions:
    - path: "backend/src/main/java/**/*.java"
      instructions: |
        이 프로젝트는 Spring Framework 5.3.37 Legacy MVC입니다 (Spring Boot 아님).
        - @SpringBootApplication, SpringApplication.run() 절대 사용 금지
        - JPA, Hibernate 관련 제안 하지 말 것 (MyBatis만 사용)
        - HikariCP 2.7.4, MyBatis 3.4.6, MyBatis-Spring 1.3.2 버전 고정
        - 트랜잭션은 반드시 Service 레이어에서만 @Transactional 사용
        - 모든 API 응답은 ApiResponse<T> 래퍼 사용
        - 예외는 CustomException으로 던지고 GlobalExceptionHandler가 처리
        - application.yml 사용 금지, application.properties만 사용
    - path: "backend/src/main/resources/mapper/**/*.xml"
      instructions: |
        MyBatis XML Mapper 파일입니다.
        - 논리 삭제 적용 테이블은 반드시 WHERE is_deleted = 0 조건 포함
        - snake_case 컬럼명 사용 (mapUnderscoreToCamelCase=true 설정되어 있음)
        - resultType은 mybatis-config.xml에 등록된 typeAlias 사용
    - path: "frontend/src/**/*.vue"
      instructions: |
        Vue.js 3 Composition API (<script setup>) 사용 프로젝트입니다.
        - Options API 방식 제안 하지 말 것
        - 상태관리는 Pinia 사용 (Vuex 제안 금지)
        - API 호출은 반드시 src/api/index.js 의 axios 인스턴스 사용
        - Tailwind CSS v4 사용 중
    - path: "frontend/src/**/*.js"
      instructions: |
        - Pinia store는 Composition API 스타일(defineStore with setup function)로 작성
        - axios 인스턴스는 src/api/index.js 에서 import해서 사용
