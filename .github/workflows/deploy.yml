name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tripass

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create serviceAccountKey.json
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > src/main/resources/serviceAccountKey.json

      - name: Create Google Cloud credentials
        run: echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > src/main/resources/google-credentials.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build WAR with Gradle
        run: ./gradlew war -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu

            cat > ~/tripass.env << 'ENVEOF'
            DB_HOST=tripass-db
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            CODEF_MODE=${{ secrets.CODEF_MODE }}
            CODEF_CLIENT_ID=${{ secrets.CODEF_CLIENT_ID }}
            CODEF_CLIENT_SECRET=${{ secrets.CODEF_CLIENT_SECRET }}
            EXCHANGE_API_KEY=${{ secrets.EXCHANGE_API_KEY }}
            GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}
            SOLAPI_API_KEY=${{ secrets.SOLAPI_API_KEY }}
            SOLAPI_API_SECRET=${{ secrets.SOLAPI_API_SECRET }}
            SOLAPI_FROM=${{ secrets.SOLAPI_FROM }}
            REFRESH_COOKIE_SECURE=${{ secrets.REFRESH_COOKIE_SECURE }}
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            KAKAO_OAUTH_CLIENT_ID=${{ secrets.KAKAO_OAUTH_CLIENT_ID }}
            KAKAO_OAUTH_CLIENT_SECRET=${{ secrets.KAKAO_OAUTH_CLIENT_SECRET }}
            KAKAO_OAUTH_REDIRECT_URI=${{ secrets.KAKAO_OAUTH_REDIRECT_URI }}
            OAUTH_STATE_COOKIE_SECURE=${{ secrets.OAUTH_STATE_COOKIE_SECURE }}
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
            GOOGLE_OAUTH_REDIRECT_URI=${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
            ENVEOF

            cd ~
            cat > docker-compose.yml << 'DCEOF'
            services:
              db:
                image: mysql:8.0
                container_name: tripass-db
                restart: unless-stopped
                environment:
                  MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  MYSQL_DATABASE: ${{ secrets.DB_NAME }}
                  TZ: Asia/Seoul
                ports:
                  - "3306:3306"
                volumes:
                  - tripass-db-data:/var/lib/mysql
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/tripass:latest
                container_name: tripass-backend
                restart: unless-stopped
                ports:
                  - "8080:8080"
                env_file:
                  - tripass.env
                depends_on:
                  db:
                    condition: service_healthy
            volumes:
              tripass-db-data:
            DCEOF

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tripass:latest
            docker compose up -d db

            # 과거 compose 프로젝트가 남긴 동일 이름 컨테이너가 있어도
            # 새 백엔드를 확실히 기동할 수 있도록 명시적으로 교체한다.
            docker rm -f tripass-backend 2>/dev/null || true
            docker compose up -d backend

            # 컨테이너 생성만으로 배포 성공 처리하지 않고 실제 API 응답을 확인한다.
            attempt=1
            until curl -fsS \
              'http://localhost:8080/api/v1/auth/check-id?loginId=healthcheck' \
              >/dev/null
            do
              if [ "$attempt" -ge 30 ]; then
                docker compose logs --tail=200 backend
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 2
            done

            docker image prune -f
